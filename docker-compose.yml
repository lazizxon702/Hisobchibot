version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: hisobchi_postgres
    restart: always
    environment:
      POSTGRES_USER: hisobchi
      POSTGRES_PASSWORD: hisobchi_secret
      POSTGRES_DB: hisobchi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hisobchi -d hisobchi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hisobchi_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: hisobchi_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    container_name: hisobchi_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/hisobchi-private;
      /usr/bin/mc anonymous set none local/hisobchi-private;
      exit 0;
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hisobchi_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      BOT_TOKEN: 9167571167:AAG9nOKq8IoKV0h8wfl2xKSeXhoYYiwppz0
      SUPER_ADMIN_TELEGRAM_ID: ${SUPER_ADMIN_TELEGRAM_ID:-0}
      DATABASE_URL: postgresql://hisobchi:hisobchi_secret@postgres:5432/hisobchi_db?schema=public
      REDIS_URL: redis://redis:6379
      APP_TIMEZONE: Asia/Tashkent
      STORAGE_DRIVER: s3
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_BUCKET: hisobchi-private
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/usr/src/app/uploads

volumes:
  postgres_data:
  redis_data:
  minio_data:
